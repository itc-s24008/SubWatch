<text x="30" y="382" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-size="9" font-weight="400" fill="#637083" text-anchor="start">（毎日、日本時間9時台（遅れると11時台か18時台）に判定）</text>
